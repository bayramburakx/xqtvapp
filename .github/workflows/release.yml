name: Release APK
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept licenses
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses > /dev/null || true

      - name: Ensure platform 34 installed
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          sdkmanager --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" || true

      - name: Install Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build Debug APKs
        run: gradle :app:assemblePhoneDebug :app:assembleTvDebug --no-daemon --stacktrace

      - name: Rename APKs
        run: |
          cp app/build/outputs/apk/phone/debug/app-phone-debug.apk xqtvapp-${{ github.ref_name }}.apk
          cp app/build/outputs/apk/tv/debug/app-tv-debug.apk xqtvapp-tv-${{ github.ref_name }}.apk

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            xqtvapp-${{ github.ref_name }}.apk
            xqtvapp-tv-${{ github.ref_name }}.apk
          generate_release_notes: true
